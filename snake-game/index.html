<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Had v prohlížeči</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <section class="hero">
      <p class="eyebrow">Jednoduchá HTML/CSS/JS hra</p>
      <h1>Had</h1>
      <p>Sbírej jablka, prodlužuj hada a vyhni se zdi i vlastnímu ocasu.</p>
    </section>

    <section class="scoreboard" aria-label="Skóre hry">
      <div>
        <span>Skóre</span>
        <strong id="score">0</strong>
      </div>
      <div>
        <span>Nejlepší</span>
        <strong id="bestScore">0</strong>
      </div>
      <button id="startButton" type="button">Start / restart</button>
    </section>

    <canvas id="game" width="480" height="480" aria-label="Herní plocha hada"></canvas>

    <section class="help">
      <h2>Ovládání</h2>
      <p>Použij šipky nebo klávesy <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>. Na telefonu můžeš použít tlačítka níže.</p>
      <div class="touch-controls" aria-label="Dotykové ovládání">
        <button data-direction="up" aria-label="Nahoru">↑</button>
        <button data-direction="left" aria-label="Doleva">←</button>
        <button data-direction="down" aria-label="Dolů">↓</button>
        <button data-direction="right" aria-label="Doprava">→</button>
      </div>
      <p id="message" class="message">Klikni na Start a začni hrát.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
